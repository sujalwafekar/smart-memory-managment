spring.application.name=smartchat-memory-manager
server.port=${PORT:8080}

# MySQL connection. Set these environment variables or edit the defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartchat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# NVIDIA API Configuration
nvidia.api.url=${NVIDIA_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
nvidia.api.key.kimi=${NVIDIA_API_KEY_KIMI:}
nvidia.api.key.nemotron=${NVIDIA_API_KEY_NEMOTRON:}

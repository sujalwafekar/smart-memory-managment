spring.application.name=memory-chat
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# MySQL connection. Set these environment variables or edit the defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartchat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT settings. Supply JWT_SECRET in any deployed environment; this fallback is for local development only.
jwt.secret=${JWT_SECRET:c21hcnRjaGF0LWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1tdXN0LWJlLWNoYW5nZWQ=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI provider configuration. Keys are read from .env or system environment variables.
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY:}
nvidia.api.url=${NVIDIA_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
nvidia.api.key.kimi=${NVIDIA_API_KEY_KIMI:${NVIDIA_API_KEY:}}
nvidia.api.key.nemotron=${NVIDIA_API_KEY_NEMOTRON:${NVIDIA_API_KEY:}}

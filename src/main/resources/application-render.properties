# Render demo profile: an in-memory database keeps the deployed demo self-contained.
# Use DB_URL, DB_USERNAME, and DB_PASSWORD in Render to connect a persistent MySQL database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:memorychat;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
